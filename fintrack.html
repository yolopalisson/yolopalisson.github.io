<!DOCTYPE html>
<html lang="en-ZA" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e13" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#e9edf1" media="(prefers-color-scheme: light)">
<meta name="description" content="FinTrack — a mobile-first budget tracker built for the South African Rand.">
<title>FinTrack · Budget tracker</title>

<!-- Apply the saved theme before first paint to avoid a flash -->
<script>
  try {
    var t = localStorage.getItem('ft.theme');
    if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&display=swap" rel="stylesheet">
<script defer src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>

<style>
/* ============================================================
   1. TOKENS
   ============================================================ */
:root {
  --ft-font: "Poppins", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;

  --ft-bg:            #0a0e13;
  --ft-text:          #e6edf4;
  --ft-muted:         #93a7bd;
  --ft-faint:         #6b8299;

  --ft-glass:         rgba(255, 255, 255, .055);
  --ft-glass-strong:  rgba(255, 255, 255, .085);
  --ft-glass-hover:   rgba(255, 255, 255, .10);
  --ft-border:        rgba(255, 255, 255, .09);
  --ft-border-strong: rgba(255, 255, 255, .16);
  --ft-highlight:     rgba(255, 255, 255, .14);

  --ft-accent:        #9db8ae;
  --ft-accent-soft:   rgba(157, 184, 174, .14);
  --ft-on-accent:     #08110d;
  --ft-pos:           #7cc4a4;
  --ft-neg:           #e0988a;

  --ft-blur:          22px;
  --ft-r-sm:          8px;
  --ft-r:             12px;
  --ft-r-lg:          16px;
  --ft-r-xl:          20px;

  --ft-shadow:        0 1px 2px rgba(0, 0, 0, .28),
                      0 12px 32px -12px rgba(0, 0, 0, .55);
  --ft-ease:          cubic-bezier(.2, .7, .3, 1);
}

[data-theme="light"] {
  --ft-bg:            #e9edf1;
  --ft-text:          #121a22;
  --ft-muted:         #55636f;
  --ft-faint:         #7b8794;

  --ft-glass:         rgba(255, 255, 255, .58);
  --ft-glass-strong:  rgba(255, 255, 255, .74);
  --ft-glass-hover:   rgba(255, 255, 255, .86);
  --ft-border:        rgba(16, 26, 36, .09);
  --ft-border-strong: rgba(16, 26, 36, .16);
  --ft-highlight:     rgba(255, 255, 255, .9);

  --ft-accent:        #4d7a6d;
  --ft-accent-soft:   rgba(77, 122, 109, .12);
  --ft-on-accent:     #ffffff;
  --ft-pos:           #2f7f5f;
  --ft-neg:           #b0563f;

  --ft-shadow:        0 1px 2px rgba(16, 26, 36, .06),
                      0 12px 28px -14px rgba(16, 26, 36, .22);
}

/* ============================================================
   2. BASE
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; corner-shape: squircle; }
.fab, .tx-dot, .legend-dot, .round { corner-shape: round; }

html {
  background: var(--ft-bg);
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  min-height: 100dvh;
  background: transparent;
  color: var(--ft-text);
  font-family: var(--ft-font);
  font-size: 15px;
  font-weight: 500;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* Ambient colour fields the glass refracts */
body::before {
  content: "";
  position: fixed;
  inset: -20vh -20vw;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(46vw 46vw at 12%   8%, rgba(120, 168, 158, .20), transparent 62%),
    radial-gradient(52vw 52vw at 88%   4%, rgba( 96, 132, 178, .16), transparent 64%),
    radial-gradient(60vw 60vw at 70%  96%, rgba(168, 138, 110, .14), transparent 66%);
}

[data-theme="light"] body::before {
  background:
    radial-gradient(46vw 46vw at 12%   8%, rgba(140, 186, 172, .42), transparent 62%),
    radial-gradient(52vw 52vw at 88%   4%, rgba(150, 180, 214, .36), transparent 64%),
    radial-gradient(60vw 60vw at 70%  96%, rgba(214, 184, 150, .34), transparent 66%);
}

h1, h2, h3, p { margin: 0; }

button { font-family: inherit; cursor: pointer; }

:focus-visible {
  outline: 2px solid var(--ft-accent);
  outline-offset: 2px;
  border-radius: inherit;
}

.sr-only {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ============================================================
   3. GLASS SURFACES
   ============================================================ */
.card,
.chart-card,
.modal,
.tx-list {
  background: var(--ft-glass);
  -webkit-backdrop-filter: blur(var(--ft-blur)) saturate(150%);
  backdrop-filter: blur(var(--ft-blur)) saturate(150%);
  border: 1px solid var(--ft-border);
  border-radius: var(--ft-r-lg);
  box-shadow: var(--ft-shadow), inset 0 1px 0 var(--ft-highlight);
}

/* ============================================================
   4. HEADER
   ============================================================ */
.app-header {
  position: sticky;
  top: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 20px;
  padding-top: calc(12px + env(safe-area-inset-top));
  border-bottom: 1px solid var(--ft-border);
  background: color-mix(in srgb, var(--ft-bg) 62%, transparent);
  -webkit-backdrop-filter: blur(16px) saturate(140%);
  backdrop-filter: blur(16px) saturate(140%);
}

.logo {
  display: flex;
  align-items: center;
  gap: 9px;
  flex: 0 0 auto;
  min-width: 0;
}

.logo svg { width: 22px; height: 22px; color: var(--ft-accent); flex: 0 0 auto; }

.logo-text {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -.01em;
  white-space: nowrap;
}

.month-nav {
  display: flex;
  align-items: center;
  gap: 2px;
  margin: 0 auto;
}

.nav-arr {
  display: inline-grid;
  place-items: center;
  width: 44px;
  height: 44px;
  padding: 0;
  border: 1px solid transparent;
  border-radius: var(--ft-r-sm);
  background: transparent;
  color: var(--ft-muted);
  font-size: 20px;
  line-height: 1;
  transition: background .16s var(--ft-ease), color .16s var(--ft-ease), border-color .16s var(--ft-ease);
}
.nav-arr:hover { background: var(--ft-glass); border-color: var(--ft-border); color: var(--ft-text); }
.nav-arr:active { transform: scale(.94); }

.month-label {
  min-width: 128px;
  text-align: center;
  font-size: 13.5px;
  font-weight: 600;
  letter-spacing: -.005em;
  white-space: nowrap;
}

.theme-btn {
  display: inline-grid;
  place-items: center;
  width: 44px;
  height: 44px;
  padding: 0;
  flex: 0 0 auto;
  border: 1px solid var(--ft-border);
  border-radius: var(--ft-r-sm);
  background: var(--ft-glass);
  color: var(--ft-text);
  transition: background .16s var(--ft-ease), border-color .16s var(--ft-ease);
}
.theme-btn:hover { background: var(--ft-glass-hover); border-color: var(--ft-border-strong); }
.theme-btn svg { width: 18px; height: 18px; }

[data-theme="light"] .icon-sun  { display: none; }
[data-theme="dark"]  .icon-moon { display: none; }

/* ============================================================
   5. LAYOUT
   ============================================================ */
.wrap {
  max-width: 1080px;
  margin: 0 auto;
  padding: 20px;
  padding-bottom: 24px;
}

/* ============================================================
   6. OFF-MONTH BANNER
   ============================================================ */
.offmonth {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 16px;
  padding: 10px 14px;
  border: 1px solid var(--ft-border);
  border-radius: var(--ft-r-sm);
  background: var(--ft-accent-soft);
  color: var(--ft-muted);
  font-size: 12.5px;
}
.offmonth[hidden] { display: none; }
.offmonth button {
  padding: 0;
  border: 0;
  background: none;
  color: var(--ft-text);
  font-size: 12.5px;
  font-weight: 600;
  text-decoration: underline;
  text-underline-offset: 2px;
}

/* ============================================================
   7. SUMMARY
   ============================================================ */
.summary-grid {
  display: grid;
  grid-template-columns: 1.5fr 1fr 1fr;
  gap: 14px;
  margin-bottom: 14px;
}

.card { padding: 18px 20px; }

.card-hero { background: var(--ft-glass-strong); }

.card-label {
  font-size: 11.5px;
  font-weight: 500;
  letter-spacing: .01em;
  color: var(--ft-muted);
}

.card-bal {
  margin-top: 8px;
  font-size: clamp(26px, 4.4vw, 34px);
  font-weight: 600;
  letter-spacing: -.025em;
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
}

.card-sub {
  margin-top: 6px;
  font-size: 12px;
  color: var(--ft-faint);
}

.card-val {
  margin-top: 8px;
  font-size: 21px;
  font-weight: 600;
  letter-spacing: -.015em;
  font-variant-numeric: tabular-nums;
}

.pos { color: var(--ft-pos); }
.neg { color: var(--ft-neg); }

/* ============================================================
   8. CHARTS
   ============================================================ */
.charts {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-bottom: 14px;
}

.chart-card { padding: 18px 20px; }

.chart-title {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--ft-muted);
  margin-bottom: 14px;
}

.chart-wrap {
  position: relative;
  width: 100%;
  height: 232px;
}

.doughnut-centre {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  pointer-events: none;
}
.doughnut-centre span {
  display: block;
  font-size: 10.5px;
  color: var(--ft-faint);
  margin-bottom: 2px;
}
.doughnut-centre strong {
  font-size: 15px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.legend {
  list-style: none;
  margin: 16px 0 0;
  padding: 0;
  display: grid;
  gap: 8px;
}

.legend li {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 12.5px;
  color: var(--ft-muted);
}

.legend-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--c);
  flex: 0 0 auto;
}

.legend-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.legend-val {
  color: var(--ft-text);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.chart-empty {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  gap: 12px;
  padding: 20px;
  text-align: center;
  font-size: 12.5px;
  color: var(--ft-muted);
}
.chart-empty[hidden] { display: none; }

/* ============================================================
   9. TRANSACTIONS
   ============================================================ */
.tx-head {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}

.tx-head h2 {
  font-size: 13px;
  font-weight: 600;
  color: var(--ft-muted);
  flex: 1 1 auto;
}

.search-field {
  position: relative;
  flex: 0 1 240px;
}
.search-field svg {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  width: 15px;
  height: 15px;
  color: var(--ft-faint);
  pointer-events: none;
}

.tx-list {
  list-style: none;
  margin: 0;
  padding: 8px;
  padding-bottom: calc(88px + env(safe-area-inset-bottom));
  display: grid;
  gap: 6px;
}

.tx-row {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 56px;
  padding: 10px 12px;
  border: 1px solid transparent;
  border-radius: var(--ft-r);
  background: transparent;
  color: inherit;
  font: inherit;
  text-align: left;
  transition: background .16s var(--ft-ease), border-color .16s var(--ft-ease);
}
.tx-row:hover { background: var(--ft-glass-hover); border-color: var(--ft-border); }

.tx-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--c);
  flex: 0 0 auto;
}

.tx-main { flex: 1; min-width: 0; }

.tx-desc {
  display: block;
  font-size: 13.5px;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.tx-meta {
  display: block;
  margin-top: 2px;
  font-size: 11.5px;
  color: var(--ft-faint);
}

.tx-amt {
  flex: 0 0 auto;
  font-size: 13.5px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.empty-state {
  display: grid;
  place-items: center;
  gap: 14px;
  padding: 44px 20px;
  text-align: center;
  color: var(--ft-muted);
  font-size: 13px;
}

/* ============================================================
   10. BUTTONS / FORMS
   ============================================================ */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 46px;
  padding: 0 20px;
  border: 1px solid var(--ft-border);
  border-radius: var(--ft-r-sm);
  background: var(--ft-glass);
  color: var(--ft-text);
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  transition: background .16s var(--ft-ease), transform .1s var(--ft-ease);
}
.btn:hover { background: var(--ft-glass-hover); }
.btn:active { transform: scale(.98); }

.btn-primary {
  background: var(--ft-accent);
  border-color: transparent;
  color: var(--ft-on-accent);
}
.btn-primary:hover { filter: brightness(1.06); }

.btn-danger {
  margin-right: auto;
  color: var(--ft-neg);
  border-color: transparent;
  background: transparent;
  padding-left: 4px;
}
.btn-danger:hover { background: rgba(224, 152, 138, .1); }

.demo-cta {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 44px;
  padding: 0 18px;
  border: 1px solid var(--ft-border-strong);
  border-radius: var(--ft-r-sm);
  background: var(--ft-accent-soft);
  color: var(--ft-text);
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  transition: background .16s var(--ft-ease);
}
.demo-cta:hover { background: var(--ft-glass-hover); }

input, select, textarea {
  width: 100%;
  min-width: 0;
  min-height: 44px;
  padding: 0 12px;
  border: 1px solid var(--ft-border);
  border-radius: var(--ft-r-sm);
  background: var(--ft-glass);
  color: var(--ft-text);
  font-family: inherit;
  font-size: 16px; /* stops iOS zoom-on-focus */
  font-weight: 500;
}
input::placeholder { color: var(--ft-faint); font-weight: 500; }
input:focus, select:focus { border-color: var(--ft-border-strong); }

input[type="number"]::-webkit-outer-spin-button,
input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
input[type="number"] { -moz-appearance: textfield; appearance: textfield; }

input[type="date"]::-webkit-calendar-picker-indicator { opacity: .55; cursor: pointer; }
[data-theme="dark"] input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); }

select {
  appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%),
                    linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: calc(100% - 17px) 50%, calc(100% - 12px) 50%;
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
  padding-right: 34px;
}

.search-field input { padding-left: 36px; min-height: 40px; }

/* ============================================================
   11. FAB
   ============================================================ */
.fab {
  position: fixed;
  right: calc(20px + env(safe-area-inset-right));
  bottom: calc(20px + env(safe-area-inset-bottom));
  z-index: 30;
  display: grid;
  place-items: center;
  width: 54px;
  height: 54px;
  padding: 0;
  border: 1px solid var(--ft-border-strong);
  border-radius: 50%;
  background: var(--ft-accent);
  color: var(--ft-on-accent);
  box-shadow: 0 6px 20px -8px rgba(0, 0, 0, .6), inset 0 1px 0 rgba(255, 255, 255, .35);
  transition: transform .16s var(--ft-ease), filter .16s var(--ft-ease);
}
.fab:hover { filter: brightness(1.06); }
.fab:active { transform: scale(.94); }
.fab svg { width: 22px; height: 22px; }

/* ============================================================
   12. MODAL
   ============================================================ */
.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: grid;
  place-items: center;
  padding: 16px;
  background: rgba(4, 8, 12, .55);
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
}
.modal-backdrop[hidden] { display: none; }

.modal {
  width: min(440px, 100%);
  max-height: 90vh;
  max-height: 90dvh;
  overflow-y: auto;
  padding: 20px;
  border-radius: var(--ft-r-xl);
  background: color-mix(in srgb, var(--ft-bg) 82%, transparent);
}

.modal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 18px;
}
.modal-head h2 { font-size: 16px; font-weight: 600; letter-spacing: -.01em; }

.icon-btn {
  display: inline-grid;
  place-items: center;
  width: 40px;
  height: 40px;
  padding: 0;
  border: 1px solid transparent;
  border-radius: var(--ft-r-sm);
  background: transparent;
  color: var(--ft-muted);
  font-size: 22px;
  line-height: 1;
}
.icon-btn:hover { background: var(--ft-glass); color: var(--ft-text); }

.seg {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px;
  padding: 4px;
  margin-bottom: 18px;
  border: 1px solid var(--ft-border);
  border-radius: var(--ft-r-sm);
  background: var(--ft-glass);
}

.seg-btn {
  min-height: 40px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--ft-muted);
  font-family: inherit;
  font-size: 13.5px;
  font-weight: 600;
  transition: background .16s var(--ft-ease), color .16s var(--ft-ease);
}
.seg-btn[aria-checked="true"] {
  background: var(--ft-glass-strong);
  color: var(--ft-text);
  box-shadow: 0 1px 2px rgba(0, 0, 0, .22);
}

.field { display: grid; gap: 7px; margin-bottom: 14px; }
.field > span { font-size: 12.5px; color: var(--ft-muted); }

.modal-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 22px;
}

/* ============================================================
   13. RESPONSIVE
   ============================================================ */
@media (max-width: 860px) {
  .charts { grid-template-columns: 1fr; }
}

@media (max-width: 760px) {
  .app-header { gap: 8px; padding: 10px 14px; padding-top: calc(10px + env(safe-area-inset-top)); }
  .wrap { padding: 16px 14px; }

  .summary-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
  .card-hero { grid-column: 1 / -1; }

  .month-label { min-width: 112px; font-size: 12.5px; }

  .chart-wrap { height: 210px; }

  .tx-head { flex-direction: column; align-items: stretch; gap: 10px; }
  .search-field { flex: 1 1 auto; }
}

@media (max-width: 560px) {
  .logo-text { display: none; }
}

@media (max-width: 420px) {
  .summary-grid { grid-template-columns: 1fr; }
  .card { padding: 15px 16px; }
  .card-bal { font-size: 27px; }
  .chart-wrap { height: 195px; }
  .month-label { min-width: 96px; font-size: 12px; }
  .nav-arr { width: 40px; }
}

/* ============================================================
   14. MOTION
   ============================================================ */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>

<body>

<!-- ============================ HEADER ============================ -->
<header class="app-header">
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="2.5" y="5.5" width="19" height="13.5" rx="3"/>
      <path d="M2.5 10h19"/>
      <path d="M16.5 14.75h.01"/>
    </svg>
    <span class="logo-text">FinTrack</span>
  </div>

  <nav class="month-nav" aria-label="Month navigation">
    <button class="nav-arr" id="prevMonth" type="button" aria-label="Previous month">‹</button>
    <span class="month-label" id="monthLabel" aria-live="polite">—</span>
    <button class="nav-arr" id="nextMonth" type="button" aria-label="Next month">›</button>
  </nav>

  <button class="theme-btn" id="themeToggle" type="button" aria-label="Switch to light theme">
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4.2"/>
      <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/>
    </svg>
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5Z"/>
    </svg>
  </button>
</header>

<!-- ============================ MAIN ============================ -->
<main class="wrap">

  <div class="offmonth" id="offMonth" hidden>
    <span>Viewing a month other than the current one.</span>
    <button type="button" id="backToToday">Back to today</button>
  </div>

  <section class="summary-grid" aria-label="Monthly summary">
    <article class="card card-hero">
      <p class="card-label">Balance</p>
      <p class="card-bal" id="sumBalance">R 0,00</p>
      <p class="card-sub" id="sumSub">&nbsp;</p>
    </article>
    <article class="card">
      <p class="card-label">Income</p>
      <p class="card-val pos" id="sumIncome">R 0,00</p>
    </article>
    <article class="card">
      <p class="card-label">Expenses</p>
      <p class="card-val neg" id="sumExpenses">R 0,00</p>
    </article>
  </section>

  <section class="charts" aria-label="Charts">

    <article class="chart-card">
      <h2 class="chart-title">Expenses by category</h2>
      <div class="chart-wrap">
        <canvas id="chartCategory" role="img" aria-label="Doughnut chart of expenses by category"></canvas>
        <div class="doughnut-centre" id="doughnutCentre">
          <span>Total</span>
          <strong>R 0,00</strong>
        </div>
        <div class="chart-empty" id="catEmpty" hidden>
          <span>No expenses recorded this month.</span>
        </div>
      </div>
      <ul class="legend" id="catLegend"></ul>
    </article>

    <article class="chart-card">
      <h2 class="chart-title">Daily spending</h2>
      <div class="chart-wrap">
        <canvas id="chartDaily" role="img" aria-label="Bar chart of daily spending this month"></canvas>
        <div class="chart-empty" id="dayEmpty" hidden>
          <span>No spending recorded this month.</span>
        </div>
      </div>
    </article>

  </section>

  <section aria-label="Transactions">
    <div class="tx-head">
      <h2 id="txCount">Transactions</h2>
      <div class="search-field">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/>
          <path d="m20 20-3.5-3.5"/>
        </svg>
        <label class="sr-only" for="search">Search transactions</label>
        <input id="search" type="search" placeholder="Search…" autocomplete="off">
      </div>
    </div>

    <ul class="tx-list" id="txList"></ul>
  </section>

</main>

<!-- ============================ FAB ============================ -->
<button class="fab" id="fab" type="button" aria-label="Add transaction">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
    <path d="M12 5v14M5 12h14"/>
  </svg>
</button>

<!-- ============================ MODAL ============================ -->
<div class="modal-backdrop" id="modalBackdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" id="modal">
    <div class="modal-head">
      <h2 id="modalTitle">Add transaction</h2>
      <button class="icon-btn" type="button" id="modalClose" aria-label="Close">×</button>
    </div>

    <form id="txForm" novalidate>
      <div class="seg" role="radiogroup" aria-label="Transaction type">
        <button type="button" class="seg-btn" data-type="expense" role="radio" aria-checked="true">Expense</button>
        <button type="button" class="seg-btn" data-type="income"  role="radio" aria-checked="false">Income</button>
      </div>

      <label class="field">
        <span>Amount (ZAR)</span>
        <input id="fAmount" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00" required>
      </label>

      <label class="field">
        <span>Description</span>
        <input id="fDesc" type="text" maxlength="60" placeholder="e.g. Groceries" required>
      </label>

      <label class="field">
        <span>Category</span>
        <select id="fCat" required></select>
      </label>

      <label class="field">
        <span>Date</span>
        <input id="fDate" type="date" required>
      </label>

      <div class="modal-actions">
        <button type="button" class="btn btn-danger" id="btnDelete" hidden>Delete</button>
        <button type="button" class="btn" id="btnCancel">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>

<script>
/* ==============================================================
   FinTrack — application logic
   ============================================================== */
document.addEventListener('DOMContentLoaded', function () {
  'use strict';

  /* ---------- Constants ------------------------------------- */
  var STORE_TX    = 'ft.transactions.v1';
  var STORE_THEME = 'ft.theme';

  var CATEGORIES = {
    expense: [
      { id: 'food',      label: 'Food',          color: '#e0988a' },
      { id: 'transport', label: 'Transport',     color: '#e2b780' },
      { id: 'housing',   label: 'Housing',       color: '#9db8ae' },
      { id: 'utilities', label: 'Utilities',     color: '#8fa9c9' },
      { id: 'shopping',  label: 'Shopping',      color: '#b39ddb' },
      { id: 'health',    label: 'Health',        color: '#7cc4a4' },
      { id: 'fun',       label: 'Entertainment', color: '#d99bb5' },
      { id: 'other',     label: 'Other',         color: '#93a7bd' }
    ],
    income: [
      { id: 'salary',    label: 'Salary',        color: '#7cc4a4' },
      { id: 'freelance', label: 'Freelance',     color: '#9db8ae' },
      { id: 'gift',      label: 'Gift',          color: '#8fa9c9' },
      { id: 'other-in',  label: 'Other',         color: '#93a7bd' }
    ]
  };

  var ALL_CATS = {};
  CATEGORIES.expense.concat(CATEGORIES.income).forEach(function (c) { ALL_CATS[c.id] = c; });

  /* ---------- Formatting ------------------------------------ */
  var ZAR = new Intl.NumberFormat('en-ZA', {
    style: 'currency', currency: 'ZAR',
    minimumFractionDigits: 2, maximumFractionDigits: 2
  });
  var MONTHS = ['January','February','March','April','May','June',
                'July','August','September','October','November','December'];

  function fmt(n)  { return ZAR.format(n); }
  function pad(n)  { return n < 10 ? '0' + n : '' + n; }
  function iso(d)  { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parseISO(s) {
    var p = s.split('-').map(Number);
    return new Date(p[0], p[1] - 1, p[2]);
  }
  function daysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }
  function fmtShortDate(s) {
    var d = parseISO(s);
    return d.getDate() + ' ' + MONTHS[d.getMonth()].slice(0, 3);
  }
  function cssVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  /* ---------- State ----------------------------------------- */
  var transactions = load();
  var viewDate     = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
  var query        = '';
  var editingId    = null;
  var draftType    = 'expense';

  var catChart = null;
  var dayChart = null;

  /* ---------- Element refs ---------------------------------- */
  var $ = function (id) { return document.getElementById(id); };

  var elPrev    = $('prevMonth');
  var elNext    = $('nextMonth');
  var elMonth   = $('monthLabel');
  var elTheme   = $('themeToggle');
  var elOff     = $('offMonth');
  var elToday   = $('backToToday');
  var elBalance = $('sumBalance');
  var elSub     = $('sumSub');
  var elIncome  = $('sumIncome');
  var elExpense = $('sumExpenses');
  var elList    = $('txList');
  var elCount   = $('txCount');
  var elSearch  = $('search');
  var elFab     = $('fab');

  var elCatEmpty   = $('catEmpty');
  var elDayEmpty   = $('dayEmpty');
  var elLegend     = $('catLegend');
  var elDoughnut   = $('doughnutCentre');

  var elBackdrop = $('modalBackdrop');
  var elModal    = $('modal');
  var elModalTtl = $('modalTitle');
  var elClose    = $('modalClose');
  var elCancel   = $('btnCancel');
  var elDelete   = $('btnDelete');
  var elForm     = $('txForm');
  var elAmount   = $('fAmount');
  var elDesc     = $('fDesc');
  var elCat      = $('fCat');
  var elDate     = $('fDate');
  var segButtons = Array.prototype.slice.call(document.querySelectorAll('.seg-btn'));

  var lastFocus = null;

  /* ---------- Persistence ----------------------------------- */
  function load() {
    try {
      var raw = localStorage.getItem('ft.transactions.v1');
      if (!raw) return [];
      var parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed.filter(isValidTx) : [];
    } catch (e) { return []; }
  }

  function isValidTx(t) {
    return t && typeof t.id === 'string' && typeof t.amount === 'number' &&
           typeof t.date === 'string' && typeof t.desc === 'string' &&
           (t.type === 'income' || t.type === 'expense');
  }

  function persist() {
    try { localStorage.setItem(STORE_TX, JSON.stringify(transactions)); } catch (e) {}
  }

  function saveTheme(t) {
    try { localStorage.setItem(STORE_THEME, t); } catch (e) {}
  }

  /* ---------- Helpers --------------------------------------- */
  function monthKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1); }

  function txsForView() {
    var key = monthKey(viewDate);
    return transactions.filter(function (t) { return t.date.slice(0, 7) === key; });
  }

  function isCurrentMonth() {
    var now = new Date();
    return viewDate.getFullYear() === now.getFullYear() &&
           viewDate.getMonth() === now.getMonth();
  }

  /* ---------- Rendering: header ----------------------------- */
  function renderHeader() {
    elMonth.textContent = MONTHS[viewDate.getMonth()] + ' ' + viewDate.getFullYear();
    elOff.hidden = isCurrentMonth();
  }

  /* ---------- Rendering: summary ---------------------------- */
  function renderSummary() {
    var txs = txsForView();
    var income = 0, expense = 0;

    txs.forEach(function (t) {
      if (t.type === 'income') income += t.amount;
      else expense += t.amount;
    });

    elBalance.textContent = fmt(income - expense);
    elIncome.textContent  = fmt(income);
    elExpense.textContent = fmt(expense);
    elSub.textContent     = txs.length + (txs.length === 1 ? ' transaction' : ' transactions');
  }

  /* ---------- Rendering: list ------------------------------- */
  function renderList() {
    var txs = txsForView().slice();

    if (query) {
      var q = query.toLowerCase();
      txs = txs.filter(function (t) {
        var cat = ALL_CATS[t.cat];
        return t.desc.toLowerCase().indexOf(q) !== -1 ||
               (cat && cat.label.toLowerCase().indexOf(q) !== -1);
      });
    }

    txs.sort(function (a, b) {
      if (a.date === b.date) return 0;
      return a.date < b.date ? 1 : -1;
    });

    elCount.textContent = query
      ? txs.length + ' result' + (txs.length === 1 ? '' : 's')
      : 'Transactions';

    if (transactions.length === 0) {
      elList.innerHTML =
        '<li class="empty-state">' +
          '<p>No transactions yet.</p>' +
          '<button class="demo-cta" type="button" id="loadDemo">Load sample data</button>' +
        '</li>';
      $('loadDemo').addEventListener('click', loadDemoData);
      return;
    }

    if (txs.length === 0) {
      elList.innerHTML =
        '<li class="empty-state"><p>' +
          (query ? 'No transactions match your search.' : 'No transactions recorded this month.') +
        '</p></li>';
      return;
    }

    var html = '';
    txs.forEach(function (t) {
      var cat = ALL_CATS[t.cat] || { label: 'Other', color: '#93a7bd' };
      var sign = t.type === 'income' ? '+' : '−';
      html +=
        '<li>' +
          '<button class="tx-row" type="button" data-id="' + t.id + '">' +
            '<span class="tx-dot" style="--c:' + cat.color + '"></span>' +
            '<span class="tx-main">' +
              '<span class="tx-desc">' + esc(t.desc) + '</span>' +
              '<span class="tx-meta">' + esc(cat.label) + ' · ' + fmtShortDate(t.date) + '</span>' +
            '</span>' +
            '<span class="tx-amt ' + (t.type === 'income' ? 'pos' : '') + '">' +
              sign + fmt(t.amount) +
            '</span>' +
          '</button>' +
        '</li>';
    });
    elList.innerHTML = html;
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* ---------- Rendering: charts ----------------------------- */
  function baseOptions() {
    return {
      responsive: true,
      maintainAspectRatio: false,
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      animation: window.matchMedia('(prefers-reduced-motion: reduce)').matches
        ? false
        : { duration: 400 },
      plugins: { legend: { display: false }, tooltip: { enabled: false } }
    };
  }

  function initCharts() {
    if (typeof Chart === 'undefined') return;

    Chart.defaults.font.family = '"Poppins", system-ui, sans-serif';
    Chart.defaults.font.size = 11;

    var opts1 = baseOptions();
    opts1.cutout = '68%';

    catChart = new Chart($('chartCategory').getContext('2d'), {
      type: 'doughnut',
      data: { labels: [], datasets: [{
        data: [], backgroundColor: [],
        borderWidth: 0, spacing: 2, borderRadius: 4
      }] },
      options: opts1
    });

    var opts2 = baseOptions();
    opts2.scales = {
      x: { grid: { display: false }, border: { display: false }, ticks: { maxRotation: 0, autoSkip: false } },
      y: { beginAtZero: true, grid: { drawTicks: false }, border: { display: false } }
    };

    dayChart = new Chart($('chartDaily').getContext('2d'), {
      type: 'bar',
      data: { labels: [], datasets: [{
        data: [], backgroundColor: [], borderRadius: 5, borderSkipped: false, maxBarThickness: 14
      }] },
      options: opts2
    });

    applyChartTheme();
    updateCharts();
  }

  function applyChartTheme() {
    if (!catChart) return;
    var muted = cssVar('--ft-muted');
    var border = cssVar('--ft-border');
    Chart.defaults.color = muted;

    dayChart.options.scales.x.ticks.color = muted;
    dayChart.options.scales.y.ticks.color = muted;
    dayChart.options.scales.y.grid.color = border;

    dayChart.options.scales.x.ticks.callback = function (value, index) {
      var day = index + 1;
      return (day === 1 || day % 5 === 0) ? day : '';
    };
    dayChart.options.scales.y.ticks.callback = function (value) {
      if (value >= 1000) return 'R ' + (value / 1000) + 'k';
      return 'R ' + value;
    };

    dayChart.update('none');
  }

  function updateCharts() {
    if (!catChart) return;

    var txs = txsForView();
    var accent = cssVar('--ft-accent');

    /* --- Doughnut: expenses by category --- */
    var byCat = {};
    var totalExpense = 0;
    txs.forEach(function (t) {
      if (t.type !== 'expense') return;
      byCat[t.cat] = (byCat[t.cat] || 0) + t.amount;
      totalExpense += t.amount;
    });

    var keys = Object.keys(byCat).sort(function (a, b) { return byCat[b] - byCat[a]; });

    if (keys.length === 0) {
      elCatEmpty.hidden = false;
      elDoughnut.style.display = 'none';
      elLegend.innerHTML = '';
      catChart.data.labels = [];
      catChart.data.datasets[0].data = [];
      catChart.data.datasets[0].backgroundColor = [];
    } else {
      elCatEmpty.hidden = true;
      elDoughnut.style.display = '';
      elDoughnut.innerHTML = '<span>Total</span><strong>' + fmt(totalExpense) + '</strong>';

      catChart.data.labels = keys.map(function (k) { return ALL_CATS[k] ? ALL_CATS[k].label : 'Other'; });
      catChart.data.datasets[0].data = keys.map(function (k) { return byCat[k]; });
      catChart.data.datasets[0].backgroundColor = keys.map(function (k) {
        return ALL_CATS[k] ? ALL_CATS[k].color : '#93a7bd';
      });

      var legend = '';
      keys.forEach(function (k) {
        var cat = ALL_CATS[k] || { label: 'Other', color: '#93a7bd' };
        var pct = Math.round((byCat[k] / totalExpense) * 100);
        legend +=
          '<li>' +
            '<span class="legend-dot" style="--c:' + cat.color + '"></span>' +
            '<span class="legend-label">' + esc(cat.label) + '</span>' +
            '<span class="legend-val">' + pct + '%</span>' +
          '</li>';
      });
      elLegend.innerHTML = legend;
    }
    catChart.update();

    /* --- Bar: daily spending --- */
    var y = viewDate.getFullYear();
    var m = viewDate.getMonth();
    var days = daysInMonth(y, m);
    var daily = new Array(days).fill(0);

    txs.forEach(function (t) {
      if (t.type !== 'expense') return;
      var d = parseISO(t.date).getDate() - 1;
      if (d >= 0 && d < days) daily[d] += t.amount;
    });

    var hasSpend = daily.some(function (v) { return v > 0; });
    elDayEmpty.hidden = hasSpend;

    dayChart.data.labels = daily.map(function (_, i) { return i + 1; });
    dayChart.data.datasets[0].data = daily;
    dayChart.data.datasets[0].backgroundColor = accent;
    dayChart.update();
  }

  /* ---------- Master render --------------------------------- */
  function render() {
    renderHeader();
    renderSummary();
    renderList();
    updateCharts();
  }

  /* ---------- Demo data ------------------------------------- */
  function loadDemoData() {
    var y = viewDate.getFullYear();
    var m = viewDate.getMonth();
    var maxDay = daysInMonth(y, m);
    var d = function (day) { return iso(new Date(y, m, Math.min(day, maxDay))); };

    var seed = [
      ['income',  24500, 'Monthly salary',   'salary',    1],
      ['expense',  8500, 'Rent',             'housing',   2],
      ['expense',   890, 'Electricity',      'utilities', 3],
      ['expense',   349, 'Fibre internet',   'utilities', 4],
      ['expense',   620, 'Fuel',             'transport', 5],
      ['expense',  1240, 'Groceries',        'food',      6],
      ['expense',   180, 'Coffee & lunch',   'food',      9],
      ['expense',   210, 'Gym membership',   'health',   10],
      ['expense',   780, 'Dinner out',       'fun',      12],
      ['income',   3200, 'Freelance invoice','freelance',14],
      ['expense',   560, 'Ride share',       'transport',15],
      ['expense',  1105, 'Groceries',        'food',     18],
      ['expense',  1299, 'Winter jacket',    'shopping', 20],
      ['expense',   420, 'Cinema & snacks',  'fun',      22],
      ['expense',    95, 'Bank fees',        'other',    25],
      ['expense',   640, 'Pharmacy',         'health',   27]
    ];

    transactions = seed.map(function (row, i) {
      return {
        id: 'demo-' + Date.now() + '-' + i,
        type: row[0], amount: row[1], desc: row[2], cat: row[3], date: d(row[4])
      };
    });

    persist();
    render();
  }

  /* ---------- Month navigation ------------------------------ */
  elPrev.addEventListener('click', function () {
    viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth() - 1, 1);
    render();
  });

  elNext.addEventListener('click', function () {
    viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 1);
    render();
  });

  elToday.addEventListener('click', function () {
    var now = new Date();
    viewDate = new Date(now.getFullYear(), now.getMonth(), 1);
    render();
  });

  /* ---------- Search ---------------------------------------- */
  var searchTimer;
  elSearch.addEventListener('input', function (e) {
    clearTimeout(searchTimer);
    var val = e.target.value;
    searchTimer = setTimeout(function () { query = val.trim(); renderList(); }, 120);
  });

  /* ---------- Theme ----------------------------------------- */
  function syncThemeButton() {
    var light = document.documentElement.getAttribute('data-theme') === 'light';
    elTheme.setAttribute('aria-label', light ? 'Switch to dark theme' : 'Switch to light theme');
    elTheme.setAttribute('aria-pressed', String(light));
  }

  elTheme.addEventListener('click', function () {
    var next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', next);
    saveTheme(next);
    syncThemeButton();
    applyChartTheme();
    updateCharts();
  });

  syncThemeButton();

  /* ---------- Modal ----------------------------------------- */
  function fillCategories(type) {
    elCat.innerHTML = CATEGORIES[type].map(function (c) {
      return '<option value="' + c.id + '">' + c.label + '</option>';
    }).join('');
  }

  function setType(type) {
    draftType = type;
    segButtons.forEach(function (b) {
      b.setAttribute('aria-checked', String(b.dataset.type === type));
    });
    fillCategories(type);
  }

  function openModal(tx) {
    lastFocus = document.activeElement;
    editingId = tx ? tx.id : null;
    elModalTtl.textContent = tx ? 'Edit transaction' : 'Add transaction';

    if (tx) {
      setType(tx.type);
      elAmount.value = tx.amount;
      elDesc.value   = tx.desc;
      elCat.value    = tx.cat;
      elDate.value   = tx.date;
      elDelete.hidden = false;
    } else {
      setType('expense');
      elAmount.value = '';
      elDesc.value   = '';
      elDate.value   = iso(new Date());
      elDelete.hidden = true;
    }

    elBackdrop.hidden = false;
    document.body.style.overflow = 'hidden';
    setTimeout(function () { elAmount.focus(); }, 40);
  }

  function closeModal() {
    elBackdrop.hidden = true;
    document.body.style.overflow = '';
    editingId = null;
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  elFab.addEventListener('click', function () { openModal(null); });
  elClose.addEventListener('click', closeModal);
  elCancel.addEventListener('click', closeModal);

  elBackdrop.addEventListener('click', function (e) {
    if (e.target === elBackdrop) closeModal();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !elBackdrop.hidden) closeModal();
  });

  segButtons.forEach(function (btn) {
    btn.addEventListener('click', function () { setType(btn.dataset.type); });
  });

  elForm.addEventListener('submit', function (e) {
    e.preventDefault();

    var amount = parseFloat(elAmount.value);
    var desc   = elDesc.value.trim();
    var cat    = elCat.value;
    var date   = elDate.value;

    if (!isFinite(amount) || amount <= 0) { elAmount.focus(); return; }
    if (!desc) { elDesc.focus(); return; }
    if (!date) { elDate.focus(); return; }

    if (editingId) {
      var idx = transactions.findIndex(function (t) { return t.id === editingId; });
      if (idx !== -1) {
        transactions[idx] = {
          id: editingId, type: draftType,
          amount: Math.round(amount * 100) / 100,
          desc: desc, cat: cat, date: date
        };
      }
    } else {
      transactions.push({
        id: 'tx-' + Date.now() + '-' + Math.floor(Math.random() * 1e6),
        type: draftType,
        amount: Math.round(amount * 100) / 100,
        desc: desc, cat: cat, date: date
      });
    }

    persist();
    closeModal();
    render();
  });

  elDelete.addEventListener('click', function () {
    if (!editingId) return;
    if (!confirm('Delete this transaction?')) return;
    transactions = transactions.filter(function (t) { return t.id !== editingId; });
    persist();
    closeModal();
    render();
  });

  /* ---------- List interaction ------------------------------ */
  elList.addEventListener('click', function (e) {
    var row = e.target.closest('.tx-row');
    if (!row) return;
    var tx = transactions.find(function (t) { return t.id === row.dataset.id; });
    if (tx) openModal(tx);
  });

  /* ---------- Boot ------------------------------------------ */
  render();
  initCharts();
  updateCharts();
});
</script>

</body>
</html>
